name: Daily arXiv Paper Digest

on:
  schedule:
    - cron: '* * * * *'
    workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-arxiv-paper-digest
  cancel-in-progress: false

jobs:
  fetch-and-send:
    runs-on: ubuntu-latest
    
    steps:
      # 1. Checkout code
      - name: 📥 Checkout Code
        uses: actions/checkout@v5
      
      # 2. Setup Python environment
      - name: 🐍 Setup Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'
      
      # 3. Install dependencies
      - name: 📦 Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      # 4. Run the paper digest script
      - name: 🚀 Run Paper Digest Script
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          SENDER_PASSWORD: ${{ secrets.SENDER_PASSWORD }}
          RECEIVER_EMAIL: ${{ secrets.RECEIVER_EMAIL }}
          SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
        run: |
          python fetch_papers.py

      # Persist the successful delivery history for the next daily run.
      - name: 📝 Save Push History
        run: |
          if git diff --quiet -- sent_papers.json; then
            echo "No new push history to save"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sent_papers.json
          git commit -m "chore: update arXiv push history"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
